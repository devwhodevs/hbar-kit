name: Bug report
description: Report a problem with an @hbar-kit package
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — a minimal reproduction is the
        single most helpful thing.
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@hbar-kit/core"
        - "@hbar-kit/mirror"
        - "@hbar-kit/payments"
        - other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "e.g. 0.1.0"
    validations:
      required: true
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - testnet
        - mainnet
        - previewnet
        - custom / self-hosted Mirror Node
        - n/a
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small code snippet, or a link to a repo/StackBlitz. Redact account IDs if needed.
      render: ts
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "Node version, OS, runtime (Node/Edge/browser)"
    validations:
      required: true
