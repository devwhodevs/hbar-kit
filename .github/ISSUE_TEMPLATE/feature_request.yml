name: Feature request
description: Suggest an idea or improvement for hbar-kit
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of hbar-kit does this relate to?
      options:
        - Payment verification (verifyHbarPayment / verifyHtsPayment)
        - Payment links / checkout / invoice flow
        - Mirror Node client (@hbar-kit/mirror)
        - Core primitives (amounts, ids, network)
        - Docs or example request
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that hbar-kit makes hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the ideal API or behavior look like? Sketch the call site if you can.
      render: ts
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
